<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Us and White Water Rafting</title>
    <meta name="description"
        content="If you're looking for new experiences where adrenaline and water are your companions, you've come to the right place.">
    <meta name="author" content="Jose Rodrigo Olivarez Marcelino">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-dryoarlogo.png" alt="WWR logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <div class="info">
            <h1>White Water Rafting</h1>
            <p>23 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
            <p>Info@whitewater.com</p>
        </div>
        <div class="box">
            <div class="map">
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d104364.75696138936!2d-111.73540757466894!3d35.171615205751124!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1ses-419!2smx!4v1764166641613!5m2!1ses-419!2smx"
                    width="800" height="800" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
            <form class="content">
                <div class="column1">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="placeholder">
                </div>
                <div class="column1">
                    <label for="Email">Email</label>
                    <input type="text" id="Email" name="Email" placeholder="placeholder">
                </div>
                <div class="radio">
                    <label for="Purpose">Message Purpose</label>
                    <div class="radio-option">
                        <input type="radio" id="inquiry" name="purpose" value="general">
                        <label for="inquiry">General Inquiry</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="reservation" name="purpose" value="reservation">
                        <label for="reservation">Reservation Question</label>
                    </div>

                    <div class="radio-option">
                        <input type="radio" id="suggestion" name="purpose" value="website">
                        <label for="suggestion">Website Suggestion</label>
                    </div>
                </div>
                <div class="column1">
                    <label for="Message">Message</label>
                    <textarea id="Message" name="Message" rows="4" placeholder="Type here"></textarea>
                </div>
                <div class="column3">
                    <label for="subscribe">Please Subscribe me to the monthyly newsletter</label>
                    <input type="checkbox" id="subscribe" name="subscribe">
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </div>
        <section class="adventure">
            <h2>Adventure Awaits You!</h2>
            <figure>
                <img src="images/rafting20_600.jpg" alt="two kayak paddles" />
                <figcaption>Two kayak paddles</figcaption>
            </figure>
            <figure>
                <img src="images/rafting26_600.jpg" alt="inflatable boats" />
                <figcaption>Inflatable boats</figcaption>
            </figure>
            <figure>
                <img src="images/rafting43_600.jpg" alt="mountainous natural environment" />
                <figcaption>Mountainous natural environment</figcaption>
            </figure>
        </section>
    </main>
    <footer>
        <p>©️ 2025 White Water Rafting Jose Rodrigo Olivarez Marcelino</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-bw.svg" alt="Facebook icon" width="100">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-bw.svg" alt="Instagram icon" width="100">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-bw.svg" alt="Linkedin icon" width="100">
            </a>
        </nav>
    </footer>
</body>

</html>
