<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <header>

    </header>
    <main>
        <form>
            <label for="fullname">full Name:</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="useremail">Email:</label>
            <input type="text" id="useremail" name="useremail" required>

            <label for="browser">What is your favorite internet browser?</label>
            <select name="browser" id="browser">
                <option value="1">Chrome</option>
                <option value="2">Firefox</option>
                <option value="3">Brave</option>
            </select>
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" id="pet" name="pet">
            <label for="feedback">List the places you have lived:</label>
            <textarea id="feedback" name="feedback" rows="4"
                placeholder="Stillwater Florida, Amsterdam Netherlands, Tibuktu Mali"></textarea>
            <button type="submit">submit Poll</button>
        </form>
    </main>
    <footer>

    </footer>
</body>

</html>
